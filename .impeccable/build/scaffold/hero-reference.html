<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: scene-directory.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#081619}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-header region chrome" data-region="header"><!-- Flat dark navigation surface and fine lower rule --></div>
  <div class="r-brand region text" data-region="brand"><!-- END OF ABYSS brand letters --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-guides region control" data-region="nav-guides"><!-- Guides dropdown navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-guides); a control need not have button chrome --></div>
  <div class="r-nav-weapons region control" data-region="nav-weapons"><!-- Weapons dropdown navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-weapons); a control need not have button chrome --></div>
  <div class="r-nav-notes region control" data-region="nav-notes"><!-- Return notes dropdown navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-notes); a control need not have button chrome --></div>
  <div class="r-nav-platforms region control" data-region="nav-platforms"><!-- Platforms dropdown navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-platforms); a control need not have button chrome --></div>
  <div class="r-theme-toggle region control" data-region="theme-toggle"><!-- Oval outline theme switch with moon glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop theme-toggle); a control need not have button chrome --></div>
  <figure class="r-scene region plate" data-region="scene"><img src="../../../assets/plates/scene.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-headline region text" data-region="headline"><!-- END OF ABYSS headline letters in a tall condensed face --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subtitle region text" data-region="subtitle"><!-- Doors, weapons and return routes. subtitle --><p style="font-size:var(--r-subtitle-font);line-height:1.05;margin:0">subtitle</p></div>
  <div class="r-row-1 region chrome" data-region="row-1"><!-- Flat orange selected directory row surface with a fine lower rule --></div>
  <div class="r-entry-1 region text" data-region="entry-1"><!-- Energy node door will not open guide title --><p style="font-size:var(--r-entry-1-font);line-height:1.05;margin:0">entry-1</p></div>
  <div class="r-summary-1 region text" data-region="summary-1"><!-- One line player question for Energy node door will not open --><p style="font-size:var(--r-summary-1-font);line-height:1.05;margin:0">summary-1</p></div>
  <div class="r-arrow-1 region control" data-region="arrow-1"><!-- Thin right arrow link glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arrow-1); a control need not have button chrome --></div>
  <div class="r-row-2 region chrome" data-region="row-2"><!-- Flat dark directory row surface with a fine lower rule --></div>
  <div class="r-entry-2 region text" data-region="entry-2"><!-- Scanner and door requirements guide title --><p style="font-size:var(--r-entry-2-font);line-height:1.05;margin:0">entry-2</p></div>
  <div class="r-summary-2 region text" data-region="summary-2"><!-- One line player question for Scanner and door requirements --><p style="font-size:var(--r-summary-2-font);line-height:1.05;margin:0">summary-2</p></div>
  <div class="r-arrow-2 region control" data-region="arrow-2"><!-- Thin right arrow link glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arrow-2); a control need not have button chrome --></div>
  <div class="r-row-3 region chrome" data-region="row-3"><!-- Flat dark directory row surface with a fine lower rule --></div>
  <div class="r-entry-3 region text" data-region="entry-3"><!-- Find a missing weapon guide title --><p style="font-size:var(--r-entry-3-font);line-height:1.05;margin:0">entry-3</p></div>
  <div class="r-summary-3 region text" data-region="summary-3"><!-- One line player question for Find a missing weapon --><p style="font-size:var(--r-summary-3-font);line-height:1.05;margin:0">summary-3</p></div>
  <div class="r-arrow-3 region control" data-region="arrow-3"><!-- Thin right arrow link glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arrow-3); a control need not have button chrome --></div>
  <div class="r-row-4 region chrome" data-region="row-4"><!-- Flat dark directory row surface with a fine lower rule --></div>
  <div class="r-entry-4 region text" data-region="entry-4"><!-- Save pods, death and supplies guide title --><p style="font-size:var(--r-entry-4-font);line-height:1.05;margin:0">entry-4</p></div>
  <div class="r-summary-4 region text" data-region="summary-4"><!-- One line player question for Save pods, death and supplies --><p style="font-size:var(--r-summary-4-font);line-height:1.05;margin:0">summary-4</p></div>
  <div class="r-arrow-4 region control" data-region="arrow-4"><!-- Thin right arrow link glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arrow-4); a control need not have button chrome --></div>
  <div class="r-row-5 region chrome" data-region="row-5"><!-- Flat dark directory row surface with a fine lower rule --></div>
  <div class="r-entry-5 region text" data-region="entry-5"><!-- Map and backtracking guide title --><p style="font-size:var(--r-entry-5-font);line-height:1.05;margin:0">entry-5</p></div>
  <div class="r-summary-5 region text" data-region="summary-5"><!-- One line player question for Map and backtracking --><p style="font-size:var(--r-summary-5-font);line-height:1.05;margin:0">summary-5</p></div>
  <div class="r-arrow-5 region control" data-region="arrow-5"><!-- Thin right arrow link glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arrow-5); a control need not have button chrome --></div>
  <div class="r-row-6 region chrome" data-region="row-6"><!-- Flat dark directory row surface with a fine lower rule --></div>
  <div class="r-entry-6 region text" data-region="entry-6"><!-- Completion checklist guide title --><p style="font-size:var(--r-entry-6-font);line-height:1.05;margin:0">entry-6</p></div>
  <div class="r-summary-6 region text" data-region="summary-6"><!-- One line player question for Completion checklist --><p style="font-size:var(--r-summary-6-font);line-height:1.05;margin:0">summary-6</p></div>
  <div class="r-arrow-6 region control" data-region="arrow-6"><!-- Thin right arrow link glyph: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arrow-6); a control need not have button chrome --></div>
  <figure class="r-preview region plate" data-region="preview"><img src="../../../assets/plates/preview.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-reading-field region chrome" data-region="reading-field"><!-- Flat pale reading field below the directory --></div>
  <div class="r-helper-title region text" data-region="helper-title"><!-- What is keeping the door shut? helper heading --><p style="font-size:var(--r-helper-title-font);line-height:1.05;margin:0">helper-title</p></div>
  <div class="r-helper-copy region text" data-region="helper-copy"><!-- Four lines of explanation beneath the door helper heading --><p style="font-size:var(--r-helper-copy-font);line-height:1.05;margin:0">helper-copy</p></div>
  <div class="r-symptom-label region text" data-region="symptom-label"><!-- Door symptom input label --><p style="font-size:var(--r-symptom-label-font);line-height:1.05;margin:0">symptom-label</p></div>
  <div class="r-symptom-select region control" data-region="symptom-select"><!-- Outlined door symptom select with Choose a symptom placeholder: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop symptom-select); a control need not have button chrome --></div>
  <div class="r-notes-rule region chrome" data-region="notes-rule"><!-- Fine vertical divider between helper and notebook --></div>
  <div class="r-notes-icon region control" data-region="notes-icon"><!-- Small outlined book icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop notes-icon); a control need not have button chrome --></div>
  <div class="r-notes-title region text" data-region="notes-title"><!-- Return notebook heading --><p style="font-size:var(--r-notes-title-font);line-height:1.05;margin:0">notes-title</p></div>
  <div class="r-notes-copy region text" data-region="notes-copy"><!-- Four line notebook introduction --><p style="font-size:var(--r-notes-copy-font);line-height:1.05;margin:0">notes-copy</p></div>
  <div class="r-notes-action region control" data-region="notes-action"><!-- Muted teal Open return notebook link button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop notes-action); a control need not have button chrome --></div>
  <div class="r-notes-help region text" data-region="notes-help"><!-- Two lines of supporting notebook text --><p style="font-size:var(--r-notes-help-font);line-height:1.05;margin:0">notes-help</p></div>
</main>
</body>
</html>
